[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2smiles"
version = "1.0.0"
description = "Evidence-preserving extraction of compound structures and activities from literature PDFs"
requires-python = ">=3.11"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27", "requests>=2.31", "openpyxl>=3.1", "PyMuPDF==1.24.14", "rdkit==2026.3.1", "Pillow>=10", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
include = ["paper2smiles*", "tools.paper_si_workflow*"]
exclude = ["*.tests*", "*.trials*"]
